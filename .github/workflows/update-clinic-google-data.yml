name: Update Clinic Data from Google

on:
  schedule:
    # Monthly. Each run refreshes the ~800 least-recently-synced clinics, which stays
    # inside the 1,000 free Place Details Enterprise calls per calendar month while
    # rotating the whole table through roughly every two months.
    - cron: "0 3 1 * *" # 1st of the month, 3 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update clinic data from Google Places API
        run: npm run google:update
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      # The sync writes straight to Postgres, so Next.js has no idea the data moved.
      # Without this, refreshed hours sit behind the 24h ISR cache.
      - name: Revalidate cached pages
        if: ${{ env.REVALIDATE_TOKEN != '' }}
        run: npm run revalidate
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
